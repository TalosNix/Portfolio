name: Sincronizar CTF (HTB / THM)

on:
  schedule:
    # Todos los días a las 06:00 UTC. Ajusta si quieres otra frecuencia.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar sincronización
        # HTB_APP_TOKEN / HTB_PROFILE_ID: de momento en pausa (ver README),
        # no pasa nada si no existen como secrets, el script los omite solo.
        env:
          HTB_APP_TOKEN: ${{ secrets.HTB_APP_TOKEN }}
          HTB_PROFILE_ID: ${{ secrets.HTB_PROFILE_ID }}
          THM_USERNAME: ${{ secrets.THM_USERNAME }}
        run: python3 scripts/sync_ctf.py

      - name: Commit si hay cambios
        run: |
          git config user.name "ctf-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ctf-machines.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "chore: sincroniza máquinas CTF completadas [skip ci]"
            git push
          fi
